<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" preserveAspectRatio="none">
  <!-- маска мазка кистью: слева непрозрачно, справа пусто, между ними рваный сухой край -->
  <defs>
    <filter id="dry" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.22" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".86" stop-color="#000"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="-20" y="-20" width="245" height="140" fill="url(#g)" filter="url(#dry)"/>
</svg>
