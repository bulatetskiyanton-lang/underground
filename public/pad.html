<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нижний Край — пульт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kurale&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Cormorant+SC:wght@700&family=Neucha&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{padding:16px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
body.play{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.w{max-width:520px;margin:0 auto;display:grid;gap:16px}
h1{font-size:30px;color:var(--paper)}
h2{font-size:26px;color:var(--paper)}
.view,.tab{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
html,body{overflow-x:hidden;max-width:100%}
body.play #title{display:none}
body.play #err:empty{display:none}
body.play{padding-top:calc(10px + env(safe-area-inset-top))}
.row{display:grid;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.race{padding:14px 10px;font-size:17px}
.race small{display:block;font-family:var(--text);text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;color:#5c4f3d;margin-top:3px;line-height:1.2}
.leg{text-align:left;font-family:var(--text);text-transform:none;letter-spacing:0;font-weight:400;font-size:17px;line-height:1.25}
.muted{color:var(--ink-soft);font-size:15px}
#err{color:var(--blood);font-size:15px;min-height:18px}

/* ===== векторный набор: всё рисуется кодом ===== */
.ic{width:1em;height:1em;display:block}
.paper{position:relative;background:var(--paper-2) var(--grain);color:var(--ink-dark);border:3px solid var(--ink-dark);box-shadow:inset 0 0 0 3px var(--paper-2),inset 0 0 0 4px var(--ink-dark),6px 6px 0 0 var(--hatch)}
.paper.orn::before{content:"";position:absolute;inset:6px;pointer-events:none;background:var(--c-tl) left top/30px no-repeat,var(--c-tr) right top/30px no-repeat,var(--c-br) right bottom/30px no-repeat,var(--c-bl) left bottom/30px no-repeat}
.ribbon{position:relative;width:100%;aspect-ratio:400/92}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%}
.ribbon-tx{position:absolute;left:16%;right:16%;top:20%;height:50%;display:grid;place-items:center;font-family:var(--display);font-size:clamp(20px,6.2vw,28px);color:var(--ink-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.medal{width:100%;aspect-ratio:1;border-radius:50%;background:var(--paper-2) var(--grain);border:3px solid var(--ink-dark);box-shadow:inset 0 0 0 4px var(--paper-2),inset 0 0 0 5.5px var(--ink-dark),0 0 0 2px var(--paper),0 0 0 3.5px var(--ink-dark);display:grid;place-items:center;color:var(--ink-dark);font-size:46%}
.medal .ic{width:64%;height:64%}

/* лист персонажа */
.sheet{display:grid;gap:12px}
.portrait{position:relative;width:62%;margin:0 auto -8%;aspect-ratio:1;border-radius:50%;background:#1b1613 center/cover;border:4px solid var(--ink-dark);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink-dark),0 0 0 11px var(--paper-2),0 0 0 13px var(--ink-dark);display:grid;place-items:center;font-family:var(--display);font-size:84px;color:#6a5c47;overflow:hidden;z-index:0}
.portrait::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 30px 6px rgba(0,0,0,.55)}
.sheet .ribbon{z-index:1}
.subtitle{text-align:center;font-size:15px;color:var(--ink-soft);margin-top:-6px;font-style:italic}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;text-align:center;padding:0 4%}
.stat{display:grid;justify-items:center;gap:5px;font-size:13px;line-height:1.15;color:var(--ink-soft)}
.stat b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--paper);line-height:1.05}
.skill{display:grid;grid-template-columns:54px 1fr 62px;gap:10px;align-items:center;padding:10px 12px;font-size:14px;line-height:1.2}
.skill .ibox .ic{width:36px;height:36px}
.skill .ibox{width:54px;height:54px;border:2px solid var(--ink-dark);box-shadow:inset 0 0 0 2px var(--paper-2),inset 0 0 0 3px var(--ink-dark);display:grid;place-items:center;font-size:30px;background:#e6d8b6}
.skill b{font-family:var(--display);font-weight:400;font-size:19px;display:block;line-height:1.05;margin-bottom:3px}
.die-btn{width:62px;height:62px;border:0;background:none;padding:0;cursor:pointer;transition:transform .1s}
.die-btn:active{transform:scale(.9) rotate(-8deg)}
.die-btn .die{width:100%;height:100%;display:block;filter:drop-shadow(2px 3px 0 var(--hatch))}
.skill.weak{grid-template-columns:54px 1fr}
.skill.weak .ibox{border-radius:50%;background:var(--ink-dark);color:var(--paper);box-shadow:none}

/* амуниция */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px}
.slot{position:relative;aspect-ratio:1;background:#eadcb9 var(--grain);border:2.5px solid var(--ink-dark);box-shadow:inset 0 0 0 3px var(--paper-2),inset 0 0 0 4px var(--ink-dark);padding:0;min-width:0;overflow:hidden;cursor:pointer;transition:transform .1s}
.slot img{position:absolute;left:9%;top:9%;width:82%;height:82%;object-fit:contain;display:block;mix-blend-mode:multiply}
.slot.empty{background:repeating-linear-gradient(135deg,rgba(20,16,12,.16) 0 1px,transparent 1px 6px),#e2d3ae;cursor:default}
.slot:active{transform:scale(.95)}
.slot.on{box-shadow:inset 0 0 0 3px var(--paper-2),inset 0 0 0 4px var(--ink-dark),0 0 0 3px var(--soul),0 0 14px 2px rgba(63,214,192,.7)}
.slot.on::after{content:"";position:absolute;right:7%;top:6%;width:10px;height:15px;background:var(--soul);border-radius:50% 50% 50% 50%/70% 70% 30% 30%;animation:flame .14s steps(2) infinite alternate;transform-origin:50% 100%}
.slot.sel{border-color:var(--candle);outline:3px solid var(--candle);outline-offset:1px}
.slot.fresh::before{content:"НОВОЕ";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--candle);color:var(--ink-dark);font-family:var(--label);font-weight:700;font-size:11px;letter-spacing:.08em;padding:1px 6px;z-index:2;animation:pulse 1.2s ease-in-out infinite}
.detail{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:16px 18px;min-height:128px}
.detail .pic{width:96px;height:96px;border:2px solid var(--ink-dark);box-shadow:inset 0 0 0 2px var(--paper-2),inset 0 0 0 3px var(--ink-dark);background:#eadcb9;padding:6px}
.detail .pic img{width:100%;height:100%;mix-blend-mode:multiply}
.detail h3{font-size:22px;line-height:1.05}
.detail p{margin:5px 0 0;font-size:15px;line-height:1.25;color:#3a2f22}
.detail .tag{display:inline-block;margin-top:6px;font-family:var(--label);font-weight:700;letter-spacing:.08em;font-size:12px;text-transform:uppercase;border:1px solid var(--ink-dark);padding:0 6px}
.detail .none{grid-column:1/-1;text-align:center;color:#5c4f3d}
.gift{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:9;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper-2) var(--grain);color:var(--ink-dark);border:4px solid var(--ink-dark);outline:2px solid var(--candle);padding:10px 12px;font-family:var(--text);font-size:14px;line-height:1.25;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:giftIn .55s cubic-bezier(.2,1.4,.4,1) both;cursor:pointer}
.gift img{width:72px;height:72px;mix-blend-mode:multiply}
.gift small{display:block;font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#964f05;font-size:12px}
.gift b{display:block;font-family:var(--display);font-weight:400;font-size:21px}
.gift.out{animation:giftOut .45s ease-in both}
@keyframes giftIn{from{transform:translateY(-140%) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes giftOut{to{transform:translateY(-140%);opacity:0}}

/* кубики */
.dice6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:18px 16px}
.d{position:relative;aspect-ratio:1;border-radius:50%;border:3px solid var(--ink-dark);background:radial-gradient(circle at 50% 45%,#3a3026 0,#14100c 70%);box-shadow:inset 0 0 0 3px #6a5c47,inset 0 6px 14px rgba(0,0,0,.8),0 0 0 3px var(--paper-2),0 0 0 4.5px var(--ink-dark);padding:0;min-width:0;cursor:pointer;transition:transform .12s}
.d .die{position:absolute;left:13%;top:13%;width:74%;height:74%;display:block}
.d.on{box-shadow:inset 0 0 0 3px var(--candle),inset 0 6px 14px rgba(0,0,0,.8),0 0 0 4px var(--candle),0 0 20px 5px rgba(240,150,43,.6);transform:scale(1.05)}
.d.on .die{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(7deg) scale(1.04)}}
.power{position:relative;height:26px;border:3px solid var(--ink-dark);background:var(--paper-2);box-shadow:inset 0 0 0 2px var(--paper-2),inset 0 0 0 3px var(--ink-dark),0 0 0 2px var(--paper);margin:0 6%}
.power i{position:absolute;left:5px;top:5px;bottom:5px;width:0;max-width:calc(100% - 10px);background:repeating-linear-gradient(135deg,var(--ink-dark) 0 2px,transparent 2px 5px)}
.power::after{content:"";position:absolute;right:-13px;top:50%;width:14px;height:14px;transform:translateY(-50%) rotate(45deg);background:var(--candle);border:2px solid var(--ink-dark)}
.sealbtn{display:block;margin:0 auto;width:min(56vw,230px);border:0;background:none;padding:0;cursor:pointer;touch-action:none;transition:transform .08s;-webkit-tap-highlight-color:transparent}
.sealbtn .seal{width:100%;display:block;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.55))}
.sealbtn.down{transform:scale(.93)}
.sealbtn.down .seal{filter:drop-shadow(0 0 16px var(--candle)) brightness(1.2)}
#talk.down .seal{filter:drop-shadow(0 0 18px var(--blood)) brightness(1.25)}
#throw-label,.seal-label{text-align:center;font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-size:14px}
#ask{display:none;border-color:var(--candle);box-shadow:5px 5px 0 0 var(--candle);animation:pulse 1.6s ease-in-out infinite}
#ask.on{display:block}

/* разговор */
#lich{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start}
#lich .face{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink-dark);box-shadow:0 0 0 3px var(--paper-2),0 0 0 5px var(--ink-dark);background:#000 url(/img/lich_closed.webp) 50% 20%/270% auto}
#lich .paper{padding:14px 16px;font-size:17px;line-height:1.3;min-height:72px}
#lich .paper::after{content:"";position:absolute;left:-13px;top:22px;width:20px;height:20px;background:var(--paper-2);border-left:3px solid var(--ink-dark);border-bottom:3px solid var(--ink-dark);transform:rotate(45deg)}
#heard{min-height:22px;font-size:16px;color:var(--ink-soft);text-align:center}
form{display:grid;grid-template-columns:1fr auto;gap:8px}

#goal{padding:10px 14px;font-size:15px;line-height:1.25;text-align:center}
#goal small{display:block;font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:#7a2a12}
/* вкладки */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0d0a07;border-top:3px solid var(--ink-soft);box-shadow:0 -3px 0 0 #0d0a07,0 -5px 0 0 var(--hatch);padding:10px 0 calc(8px + env(safe-area-inset-bottom))}
#tabs::before{content:"";position:absolute;left:0;right:0;top:3px;height:6px;background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
#tabs .bar{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;padding:6px 10px 0}
#tabs button{position:relative;display:grid;justify-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-soft);font-family:var(--label);font-weight:700;letter-spacing:.06em;font-size:11px;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
#tabs .medal{width:58px;font-size:30px;transition:transform .15s,box-shadow .15s}
#tabs button[aria-selected="true"]{color:var(--candle)}
#tabs button[aria-selected="true"] .medal{transform:translateY(-6px) scale(1.08);box-shadow:inset 0 0 0 4px var(--paper-2),inset 0 0 0 5.5px var(--ink-dark),0 0 0 3px var(--candle),0 0 16px 3px rgba(240,150,43,.6)}
#tabs button.ping::after{content:"";position:absolute;top:-2px;right:calc(50% - 30px);width:13px;height:13px;border-radius:50%;background:var(--candle);border:2px solid var(--ink-dark);animation:pulse 1s ease-in-out infinite}
body.play{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="w">
  <h1 id="title">Нижний Край</h1>
  <div id="err"></div>

  <section class="view" id="v-join">
    <div class="row"><label class="label" for="name">Как тебя зовут</label><input id="name" type="text" maxlength="20" autocomplete="off" placeholder="Антон"></div>
    <div class="row"><label class="label" for="room">Код комнаты с экрана</label><input id="room" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABCDE"></div>
    <button class="btn main" id="join" type="button">Войти в логово</button>
  </section>

  <section class="view" id="v-race" hidden>
    <h2>Кто ты такой</h2>
    <div class="grid2" id="races"></div>
  </section>

  <section class="view" id="v-legend" hidden>
    <h2 id="race-title">Твоя легенда</h2>
    <div class="muted">Выбери готовую или расскажи свою. Лич соберёт из неё монстра.</div>
    <div class="row" id="legends"></div>
    <div class="label">Своя легенда</div>
    <textarea id="legend" maxlength="700" placeholder="Кто ты, откуда взялся, чего боишься, что умеешь"></textarea>
    <button class="btn" id="dictate" type="button">Зажми и наговори легенду</button>
    <button class="btn main" id="make" type="button">Слепить монстра</button>
    <button class="btn dark" id="back-race" type="button">Другая раса</button>
  </section>

  <section class="view" id="v-wait" hidden>
    <h2>Лич лепит твоего монстра <span class="flame"></span></h2>
    <div class="muted">Кости, глина, немного плесени. Секунд десять.</div>
  </section>

  <section class="view" id="v-play" hidden>
    <div class="tab" id="t-sheet">
      <div class="sheet" id="sheet"></div>
      <button class="btn dark" id="remake" type="button">Слепить другого монстра</button>
    </div>

    <div class="tab" id="t-gear" hidden>
      <div data-ribbon="Амуниция"></div>
      <div class="muted" id="gear-hint" style="text-align:center"></div>
      <div class="paper orn"><div class="slots" id="slots"></div></div>
      <div class="paper"><div class="detail" id="detail"></div></div>
      <div class="grid2"><button class="btn" id="take" type="button" disabled>Взять</button><button class="btn main" id="use" type="button" disabled>Использовать</button></div>
    </div>

    <div class="tab" id="t-dice" hidden>
      <div data-ribbon="Кубики"></div>
      <button class="btn" id="ask" type="button"></button>
      <div class="paper orn"><div class="dice6" id="dice"></div></div>
      <div class="power"><i id="pw"></i></div>
      <button class="sealbtn" id="throw" type="button" aria-label="Бросить кубик"></button>
      <div id="throw-label">Зажми печать — сила, отпусти — бросок d20</div>
    </div>

    <div class="tab" id="t-talk" hidden>
      <div id="lich"><div class="face"></div><div class="paper"><span id="lich-text">Лич пока молчит.</span></div></div>
      <button class="sealbtn" id="talk" type="button" aria-label="Зажми и говори"></button>
      <div class="seal-label">Зажми печать и говори. Отпустил — лич услышал.</div>
      <div id="goal" class="paper" hidden></div>
      <div id="paths" class="row"></div>
      <div id="heard"></div>
      <form id="form"><input id="txt" type="text" autocomplete="off" placeholder="или напиши текстом" aria-label="Сообщение личу"><button class="btn" type="submit">Сказать</button></form>
    </div>
  </section>
</div>

<nav id="tabs" hidden><div class="bar">
  <button type="button" data-tab="sheet" data-ic="sheet" aria-selected="true">Лист</button>
  <button type="button" data-tab="gear" data-ic="bag">Вещи</button>
  <button type="button" data-tab="dice" data-ic="dice">Кубики</button>
  <button type="button" data-tab="talk" data-ic="talk">Разговор</button>
</div></nav>
<script src="/ui.js"></script>
<script src="/pad.js"></script>
</body>
</html>
